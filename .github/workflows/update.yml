name: update-audition

# 평일 한국시간 21:00 (UTC 12:00) — 장 마감(15:30) 한참 뒤, 당일 자료가 확정된 다음 갱신한다.
# KRX Open API 는 전 거래일 자료를 다음 영업일에야 올리므로, 당일치는 한국투자증권(일자별 시세·투자자 매매동향·
# 코스피 지수)으로 채우고 다음 영업일에 KRX 확정 자료로 바꾼다. GitHub 예약 실행은 몇 분~수십 분 늦을 수 있다.
on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 수집한 자료를 다음 실행으로 넘긴다. 키마다 새로 저장하고 가장 최근 것을 불러온다.
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: audition-cache-restore
          restore-keys: audition-cache-

      # 단계에 따로 제한 시간을 둔다. 넘겨도 아래 «캐시 저장»이 돌아서, 받은 만큼은 다음 실행으로 이어진다.
      - name: Update data and build page
        timeout-minutes: 150
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python tools/update_all.py .

      # 접근 토큰은 캐시에 남기지 않는다.
      - name: Drop token before caching
        if: always()
        run: rm -f cache/kis/kis_token.json

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: audition-cache-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: audition-copy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
