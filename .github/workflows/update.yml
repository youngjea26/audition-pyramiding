name: update-audition

# 평일 한국시간 20:37 · 21:07 · 21:37 · 22:07 (UTC 11:37 · 12:07 · 12:37 · 13:07) — 시간외 세션이 끝나는 20:00 이후.
# KRX Open API 는 전 거래일 자료를 다음 영업일에야 올리므로, 당일치는 한국투자증권(일자별 시세·투자자 매매동향·
# 코스피 지수)으로 채우고 다음 영업일에 KRX 확정 자료로 바꾼다.
# GitHub 예약 실행은 시각을 보장하지 않는다. 21:00 은 46분 늦게(21:46), 20:37 은 40분 넘게 늦어졌다.
# 그래서 30분 간격으로 네 번 건다 — 하나가 늦거나 빠져도 다음 것이 받아낸다. 각 실행은 4분 안팎이고
# 이미 받은 자료는 건너뛰며, 뒤 실행은 수급 잠정치를 확정치로 덮어쓰는 효과도 있다(동시에 둘이 돌지는 않는다).
on:
  schedule:
    - cron: "37 11 * * 1-5"
    - cron: "7 12 * * 1-5"
    - cron: "37 12 * * 1-5"
    - cron: "7 13 * * 1-5"
    # 재무(DART)는 밤에 느려(새 종목이 생기면 전체 재수집에 14분) 저녁 갱신을 늦춘다. 아침 06:17 KST 실행만 재무를 갱신한다.
    - cron: "17 21 * * 0-4"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 수집한 자료를 다음 실행으로 넘긴다. 키마다 새로 저장하고 가장 최근 것을 불러온다.
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: audition-cache-restore
          restore-keys: audition-cache-

      # 단계에 따로 제한 시간을 둔다. 넘겨도 아래 «캐시 저장»이 돌아서, 받은 만큼은 다음 실행으로 이어진다.
      - name: Update data and build page
        timeout-minutes: 150
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          DART_MODE: ${{ github.event.schedule == '17 21 * * 0-4' && 'auto' || 'skip' }}
        run: python tools/update_all.py .

      # 접근 토큰은 캐시에 남기지 않는다.
      - name: Drop token before caching
        if: always()
        run: rm -f cache/kis/kis_token.json

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: audition-cache-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: audition-copy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
